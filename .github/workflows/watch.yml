name: watch

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "날짜 (20261115). 비우면 텔레그램으로 지정한 값 사용"
        required: false
        type: string
      force:
        description: "날짜 조건 무시하고 실행"
        required: false
        default: false
        type: boolean

  # 6시간씩 4번 = 24시간 가동. cron 은 UTC 기준(KST-9).
  # 분을 정시에서 비켜 둔다. 정시는 전 세계 워크플로가 몰려 지연이 특히 심하다.
  # (11-06 실측: 00:00 예정이 02:18, 06:00 예정이 06:26, 18:00 예정은 10분 넘게 안 뜸)
  # 이래도 보장은 안 된다. 평소 교체는 RELAY_AFTER_MIN 이 맡고 cron 은 백업이다.
  schedule:
    - cron: "17 15 * * *"   # 00:17 KST
    - cron: "17 21 * * *"   # 06:17 KST
    - cron: "17 3 * * *"    # 12:17 KST
    - cron: "17 9 * * *"    # 18:17 KST

permissions:
  contents: write          # state.json 갱신, health 브랜치 기록
  actions: write           # 세션이 스스로 다음 실행을 요청(workflow_dispatch)

# 항상 하나만 돌게 한다. 새 실행이 뜨면 기존 것을 끊고 이어받으므로
# 겹침도 공백도 생기지 않는다.
concurrency:
  group: watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358   # 상한 360분. 다음 cron 이 올 때까지 버틴다.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python watch.py
        env:
          # --- 대상 (전부 Secrets 에서) ---
          TARGET_URL: ${{ secrets.TARGET_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          LABEL: ${{ secrets.LABEL }}

          # --- 날짜 (비워두면 텔레그램 /watch 로 지정) ---
          TARGET_DATE: ${{ inputs.target_date }}

          # --- 동작 ---
          MODE: ${{ vars.MODE || 'until' }}
          POLL_SEC: ${{ vars.POLL_SEC || '10' }}
          BURST_SEC: ${{ vars.BURST_SEC || '2' }}
          BURST_WINDOWS: ${{ vars.BURST_WINDOWS }}
          IDLE_SEC: ${{ vars.IDLE_SEC || '5' }}
          MAX_RUN_MIN: "355"
          # 시작 후 이 분이 지나면 다음 실행을 스스로 요청해서 이어받게 한다.
          # 120분: 새 실행이 (355-120)=235분 늦게 떠도 공백이 없다 (11-05 cron 은 2시간 늦었음)
          RELAY_AFTER_MIN: ${{ vars.RELAY_AFTER_MIN || '120' }}
          HEALTH: ${{ vars.HEALTH || '1' }}          # 0 이면 생존 기록/외부 ping 끔
          HEALTH_BEAT_SEC: ${{ vars.HEALTH_BEAT_SEC || '60' }}
          GAP_ALERT_SEC: ${{ vars.GAP_ALERT_SEC || '120' }}
          # 루프가 한 단계에서 이 초만큼 진행이 없으면 멈춘 것으로 보고
          # 메인 스레드 스택을 텔레그램과 health.json 에 남긴다. 0 이면 끈다.
          # (11-06 16:01 에 오류 없이 멈췄는데 단서가 안 남아서 넣었다)
          STALL_SEC: ${{ vars.STALL_SEC || '180' }}
          # 이만큼 멈춰 있으면 다음 세션을 띄우고 스스로 끝낸다. 0 이면 안 끝낸다
          STALL_EXIT_SEC: ${{ vars.STALL_EXIT_SEC || '300' }}
          # 기동 직후에 멈춘 경우에는 끝내지 않는다 (재기동이 끝없이 도는 것 방지)
          STALL_MIN_UPTIME_SEC: ${{ vars.STALL_MIN_UPTIME_SEC || '600' }}
          # 외부 감시 서비스(healthchecks.io 등) ping 주소. 없으면 ping 안 함
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          NOTIFY_START: ${{ vars.NOTIFY_START || '0' }}
          VERBOSE: ${{ vars.VERBOSE || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}

          # --- 알림 ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
