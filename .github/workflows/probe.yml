name: probe

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "무엇을 진단할지"
        required: true
        default: seat
        type: choice
        options: [seat, reach, endpoints]
      date:
        description: "날짜 (20261107). seat 진단에만 사용"
        required: false
        type: string
      page_url:
        description: "조사할 페이지 주소. endpoints 진단에만 사용"
        required: false
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 접근성 진단
        if: inputs.kind == 'reach'
        run: python probe.py
        env:
          PROBE_URL: ${{ secrets.PROBE_URL }}

      - name: 좌석 구조 진단
        if: inputs.kind == 'seat'
        run: python probe_seat.py
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          PROBE_DATE: ${{ inputs.date }}

      - name: 엔드포인트 탐색
        if: inputs.kind == 'endpoints'
        run: python probe_endpoints.py
        env:
          # 입력이 비어 있으면 감시 대상 주소를 그대로 쓴다
          PROBE_PAGE_URL: ${{ inputs.page_url || secrets.SITE_URL }}

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe.txt probe_seat.txt probe_endpoints.txt
          git diff --staged --quiet || git commit -m "probe result"
          git pull --rebase --autostash
          git push
