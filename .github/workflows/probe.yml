name: probe

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "무엇을 진단할지"
        required: true
        default: seat
        type: choice
        options: [seat, reach, endpoints, call]
      date:
        description: "날짜 (20261107). seat, call 진단에 사용"
        required: false
        type: string
      page_url:
        description: "조사할 페이지 주소. endpoints 진단에만 사용"
        required: false
        type: string
      theater:
        description: "극장 코드 (1001). call 진단에만 사용"
        required: false
        default: "1001"
        type: string
      watch_sec:
        description: "지켜볼 시간(초). call 진단에만 사용. 이 사이에 좌석을 움직이세요"
        required: false
        default: "300"
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # call 진단은 지켜보는 시간만큼 걸린다

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 접근성 진단
        if: inputs.kind == 'reach'
        run: python probe.py
        env:
          PROBE_URL: ${{ secrets.PROBE_URL }}

      - name: 좌석 구조 진단
        if: inputs.kind == 'seat'
        run: python probe_seat.py
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          PROBE_DATE: ${{ inputs.date }}

      - name: 엔드포인트 탐색
        if: inputs.kind == 'endpoints'
        run: python probe_endpoints.py
        env:
          # 입력이 비어 있으면 감시 대상 주소를 그대로 쓴다
          PROBE_PAGE_URL: ${{ inputs.page_url || secrets.SITE_URL }}

      - name: 엔드포인트 비교 호출
        if: inputs.kind == 'call'
        run: python probe_call.py
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          PROBE_THEATER: ${{ inputs.theater }}
          PROBE_DATE: ${{ inputs.date }}
          PROBE_WATCH_SEC: ${{ inputs.watch_sec }}
          PROBE_STEP_SEC: "10"
          KEYWORDS: ${{ secrets.KEYWORDS }}     # 감시 중인 영화로 팝업을 연다

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 이번에 돌린 진단의 결과 파일만 생긴다. 없는 것을 add 하면 실패하므로
          # 있는 것만 담는다.
          for f in probe.txt probe_seat.txt probe_endpoints.txt probe_call.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || git commit -m "probe result"
          git pull --rebase --autostash
          git push
